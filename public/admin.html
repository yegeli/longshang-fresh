<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#31553f">
  <title>经营概览 · 陇上鲜集管理后台</title>

</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar" aria-label="管理导航">
      <a class="brand" href="./admin.html"><span class="brand-mark">陇</span><span>陇上鲜集<small>店铺管理工作台</small></span></a>
      <div class="sidebar-label">经营工作台</div>
      <nav id="admin-nav" class="admin-nav" hidden aria-label="管理栏目">
        <button data-view="overview" class="active">经营概览</button>
        <button data-view="products">商品管理</button>
        <button data-view="orders">订单管理</button>
        <button data-view="aftersales">售后管理</button>
      </nav>
      <div class="sidebar-bottom"><span class="status-dot"></span>店铺演示工作台<p id="workspace-mode-note">正在确认运行模式与账户权限。</p></div>

    <div class="admin-workspace">

      <div id="cloud-status" class="cloud-status" role="status" aria-live="polite"></div>
      <div id="admin-alerts" class="alert-region" aria-live="polite"></div>
      <main id="admin-app" tabindex="-1"><div class="initial-state">正在确认登录状态与店铺权限…</div></main>
      <footer class="workspace-footer">陇上鲜集 · 从景泰起步，把每一份好物认真打理。</footer>
    </div>
  </div>
  <div id="drawer-root"></div>
  <div id="admin-toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="./admin.js?v=4"></script>
</body>
</html>
